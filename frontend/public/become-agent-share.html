<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Become an ASR Solar Advisor | Earn up to ₹10,000 per referral</title>
    <meta name="description" content="Join ASR Enterprises' Solar Advisor program in Bihar. Earn up to ₹10,000 per converted solar customer. Free onboarding, weekly Cashfree payouts, district-level exclusivity. Register in 2 minutes." />
    <link rel="canonical" href="https://www.asrenterprises.in/become-agent" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.asrenterprises.in/become-agent" />
    <meta property="og:title" content="Become an ASR Solar Advisor | Earn up to ₹10,000 per referral" />
    <meta property="og:description" content="Earn weekly Cashfree payouts by referring solar customers in your district. Free onboarding. Register in 2 minutes at ASR Enterprises, Bihar." />
    <meta property="og:image" content="https://www.asrenterprises.in/og-advisor.jpg" />
    <meta property="og:image:secure_url" content="https://www.asrenterprises.in/og-advisor.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Join ASR Enterprises Solar Advisor program — Bihar" />
    <meta property="og:site_name" content="ASR Enterprises" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@asrenterprises" />
    <meta name="twitter:title" content="Become an ASR Solar Advisor | Earn up to ₹10,000 per referral" />
    <meta name="twitter:description" content="Earn weekly Cashfree payouts by referring solar customers. Register in 2 minutes." />
    <meta name="twitter:image" content="https://www.asrenterprises.in/og-advisor.jpg" />

    <!-- Humans who land directly on this static page get forwarded to the
         interactive React route. Crawlers (facebookexternalhit, WhatsApp,
         Twitterbot, LinkedInBot, Slackbot, TelegramBot, etc.) ignore the
         meta refresh and index the OG tags above — exactly what we want. -->
    <meta http-equiv="refresh" content="0; url=/become-agent" />
    <link rel="preload" as="image" href="/og-advisor.jpg" />
    <script>
      // Instant JS redirect for humans (runs before 0-second refresh tick).
      if (typeof window !== "undefined") {
        window.location.replace("/become-agent");
      }
    </script>
</head>
<body style="margin:0;background:#0d1b33;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;">
    <div>
        <h1 style="font-size:28px;margin:0 0 8px;">Become an ASR Solar Advisor</h1>
        <p style="color:#cbd5e1;max-width:520px;">Earn up to ₹10,000 per referral. Weekly Cashfree payouts.</p>
        <a href="/become-agent" style="display:inline-block;margin-top:16px;padding:12px 24px;background:linear-gradient(90deg,#a855f7,#ec4899);color:#fff;border-radius:10px;text-decoration:none;font-weight:600;">Open Registration Form</a>
    </div>
</body>
</html>
